services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/data                 # database, attachments, reports
      - ./claude-sessions:/home/app/.claude  # Agent SDK chat sessions survive restarts
    expose: ["8000"]

  caddy:                                 # automatic HTTPS (Let's Encrypt)
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [agent]

volumes:
  caddy_data:
  caddy_config:
