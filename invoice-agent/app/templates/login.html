{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login">
  <h1>Payables agent</h1>
  {% if error %}<div class="notice">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <p><label for="u">Username</label><input id="u" name="username" autocomplete="username" required style="width:100%"></p>
    <p><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required style="width:100%"></p>
    <button class="btn" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
