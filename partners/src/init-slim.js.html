applyNav();mq.addEventListener('change',applyNav);function boot(){var gsap=window.gsap;if(!gsap||!window.ScrollTrigger)return;gsap.registerPlugin(window.ScrollTrigger);var ST=window.ScrollTrigger;var lowMobS=window.matchMedia('(max-width: 999px)').matches,firstSec=root.querySelector('section');root.querySelectorAll('[data-split]').forEach(function(el){if(lowMobS&&firstSec&&firstSec.contains(el))return;var text=el.textContent.trim();el.setAttribute('aria-label',text);el.innerHTML=text.split(/\s+/).map(function(w){return'<span class="wordwrap" aria-hidden="true"><span class="word">'+w+'</span></span>'}).join(' ')});if(reduced)return;var firstSection=root.querySelector('section');var lowMob=window.matchMedia('(max-width: 999px)').matches;var heroWords=(firstSection&&!lowMob)?firstSection.querySelectorAll('[data-split] .word'):[];var tl=gsap.timeline({defaults:{ease:'expo.out'}});if(heroWords.length)tl.from(heroWords,{yPercent:118,duration:1.25,stagger:0.045},0.15);if(firstSection&&!lowMob)tl.from(firstSection.querySelectorAll('[data-fade]'),{opacity:0,y:26,duration:1,stagger:0.08},0.5);if(!lowMob)tl.from(root.querySelectorAll('[data-header]'),{opacity:0,y:-20,duration:0.9},0);gsap.utils.toArray(root.querySelectorAll('[data-split]')).forEach(function(el,i){if(i===0)return;gsap.from(el.querySelectorAll('.word'),{yPercent:115,duration:1.05,ease:'expo.out',stagger:0.035,scrollTrigger:{trigger:el,start:'top 85%'}})});gsap.utils.toArray(root.querySelectorAll('[data-fade]')).forEach(function(el){if(firstSection&&firstSection.contains(el))return;gsap.from(el,{opacity:0,y:28,duration:0.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 88%'}})});gsap.utils.toArray(root.querySelectorAll('[data-card]')).forEach(function(el,i){gsap.from(el,{opacity:0,y:44,duration:1,ease:'power3.out',delay:(i%4)*0.07,scrollTrigger:{trigger:el,start:'top 90%'}})});if(root.querySelector('[data-herovid]'))gsap.to(root.querySelectorAll('[data-herovid]'),{yPercent:14,ease:'none',scrollTrigger:{trigger:root.querySelector('[data-herovid]'),start:'top top',end:'bottom top',scrub:!0}});if(root.querySelector('[data-parallax]'))gsap.to(root.querySelectorAll('[data-parallax]'),{yPercent:12,ease:'none',scrollTrigger:{trigger:root.querySelector('[data-parallax]'),start:'top bottom',end:'bottom top',scrub:!0}});root.querySelectorAll('[data-rail] a').forEach(function(a){var img=a.querySelector('img');a.addEventListener('pointerenter',function(){gsap.to(img,{scale:1.06,duration:0.9,ease:'power3.out'})});a.addEventListener('pointerleave',function(){gsap.to(img,{scale:1,duration:0.9,ease:'power3.out'})})});var header=root.querySelector('[data-header]');if(header)ST.create({start:80,onEnter:function(){gsap.to(header,{paddingTop:10,paddingBottom:10,backgroundColor:'rgba(255,255,255,.97)',duration:0.4})},onLeaveBack:function(){gsap.to(header,{paddingTop:18,paddingBottom:18,backgroundColor:'rgba(255,255,255,.93)',duration:0.4})}});setTimeout(function(){if(gsap.ticker.frame>0)return;gsap.globalTimeline.getChildren().forEach(function(t){t.kill()});ST.getAll().forEach(function(t){t.kill()});gsap.set(root.querySelectorAll('[data-fade],[data-card],[data-header]'),{opacity:1,y:0,clearProps:'opacity,transform'});gsap.set(root.querySelectorAll('.word'),{yPercent:0,clearProps:'transform'});gsap.set(root.querySelectorAll('[data-herovid],[data-parallax]'),{clearProps:'transform'})},1100);window.addEventListener('load',function(){ST.refresh()});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){ST.refresh()})}
