  <rect x="100" y="80" width="1400" height="56" rx="18" fill="#FFFFFF"/>
  <rect x="100" y="118" width="1400" height="18" fill="#FFFFFF"/>
  <circle cx="132" cy="108" r="7" fill="#E46B5D"/><circle cx="156" cy="108" r="7" fill="#E9B949"/><circle cx="180" cy="108" r="7" fill="#7BB661"/>
